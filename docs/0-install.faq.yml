id: x-rpm-0-install

<data>:
  - name:
      en: basics
      cn: 基础概念
    qa:
      - id: what-is-this-repo
        question:
          en: What is this repo?
          cn: 这个仓库是什么？
        answer:
          en: The official x-cmd RPM (Red Hat / Fedora / SUSE) repository, serving the x-cmd `noarch` package. Hosted at https://www.x-cmd.com/rpm/.
          cn: 官方 x-cmd RPM（Red Hat / Fedora / SUSE）仓库，提供 x-cmd `noarch` 包。地址：https://www.x-cmd.com/rpm/。
        confidence: 9
        reference:
          - docs/0-install.en.md
          - docs/0-install.cn.md

      - id: how-do-i-install
        question:
          en: How do I install x-cmd via dnf?
          cn: 如何通过 dnf 安装 x-cmd？
        answer:
          en: `sudo dnf install -y dnf-plugins-core && sudo dnf config-manager --add-repo https://www.x-cmd.com/rpm/x-cmd.repo && sudo dnf install -y x-cmd`.
          cn: `sudo dnf install -y dnf-plugins-core && sudo dnf config-manager --add-repo https://www.x-cmd.com/rpm/x-cmd.repo && sudo dnf install -y x-cmd`。
        confidence: 9
        reference:
          - docs/0-install.en.md

      - id: zypper-install
        question:
          en: How do I install on openSUSE?
          cn: openSUSE 上怎么装？
        answer:
          en: `sudo zypper ar -f https://www.x-cmd.com/rpm/ x-cmd && sudo zypper refresh && sudo zypper in x-cmd`.
          cn: `sudo zypper ar -f https://www.x-cmd.com/rpm/ x-cmd && sudo zypper refresh && sudo zypper in x-cmd`。
        confidence: 9
        reference:
          - docs/0-install.en.md

  - name:
      en: verification
      cn: 验证
    qa:
      - id: how-to-verify
        question:
          en: How do I verify the install worked?
          cn: 怎么确认安装成功？
        answer:
          en: Run `x --version`. You should see `0.9.9` or newer.
          cn: 跑 `x --version`，应该看到 `0.9.9` 或更新版本。
        confidence: 9
        reference:
          - docs/0-install.en.md

      - id: rpm-verify
        question:
          en: How do I verify the package without installing?
          cn: 不装怎么校验包？
        answer:
          en: `rpm -Kv https://www.x-cmd.com/rpm/Packages/x-cmd_0.9.9_all.rpm` — shows digest + signature status. Today no signature; after signing it shows key ID.
          cn: `rpm -Kv https://www.x-cmd.com/rpm/Packages/x-cmd_0.9.9_all.rpm` 显示 digest + 签名状态。今天无签名；签名上线后会显示 key ID。
        confidence: 9
        reference:
          - docs/0-install.en.md

  - name:
      en: troubleshooting
      cn: 故障排查
    qa:
      - id: no-gpgcheck-warning
        question:
          en: dnf doesn't warn about unsigned packages. Is it safe?
          cn: dnf 没警告未签名，安全吗？
        answer:
          en: Today yes — `gpgcheck=0` is explicitly opt-in. The repo declares it openly. To add real auth, wait for the GPG key (tracked in 2-security).
          cn: 今天是的——`gpgcheck=0` 是显式 opt-in。仓库公开声明。要真签名，等 GPG key 上线（在 2-security 跟踪）。
        confidence: 9
        reference:
          - docs/2-security.en.md

      - id: noarch-vs-arch
        question:
          en: Which architecture do I get?
          cn: 我拿到的是哪个架构的？
        answer:
          en: x-cmd is `noarch` — there's only one .rpm and it's identical across x86_64, aarch64, etc.
          cn: x-cmd 是 `noarch`，x86_64、aarch64 等都装同一个 .rpm。
        confidence: 9
        reference:
          - docs/0-install.en.md

      - id: dnf-vs-yum
        question:
          en: dnf vs yum — which do I have?
          cn: dnf 还是 yum？
        answer:
          en: |
            dnf is the modern default on Fedora 22+, RHEL 8+, CentOS 8+, Rocky, Alma. yum is on RHEL 7 / CentOS 7 (and as a wrapper on newer systems). zypper is openSUSE.
            The repo works with all three — same `x-cmd.repo` file, same `baseurl`.
          cn: |
            dnf 是 Fedora 22+、RHEL 8+、CentOS 8+、Rocky、Alma 的现代默认。yum 是 RHEL 7 / CentOS 7（新版是 wrapper）。zypper 是 openSUSE。
            同一个仓库支持三种——同一份 `x-cmd.repo` 文件，同一个 `baseurl`。
        confidence: 9
        reference:
          - docs/0-install.en.md
